name: CI

on:
  push:
    branches:
      - dev
      - nightly
      - beta
      - main
      - "feature/**"
  pull_request:
    branches:
      - dev
      - nightly
      - beta
      - main
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
