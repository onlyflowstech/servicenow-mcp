name: CI

on:
  push:
    branches:
      - dev
      - nightly
      - beta
      - main
      - "feature/**"
  pull_request:
    branches:
      - dev
      - nightly
      - beta
      - main
      - "feature/**"

jobs:
  engine-floor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 18.x
            expected: reject
          - node-version: 20.x
            expected: accept
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prove unsupported Node rejects and supported Node installs
        shell: bash
        run: |
          set +e
          npm ci --engine-strict --ignore-scripts --no-audit --no-fund
          status=$?
          set -e
          if [[ "${{ matrix.expected }}" == "reject" ]]; then
            test "$status" -ne 0
          else
            test "$status" -eq 0
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run release:contract
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:protocol
      - run: npm run test:profile
      - run: npm run test:release
      - run: npm pack --dry-run --json --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate

  inspector-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci --prefix tools/inspector --engine-strict --ignore-scripts
      - run: npm audit --prefix tools/inspector --audit-level=moderate

  # The container serves the dormant HTTP transport, which 2.0 does not ship —
  # see docs/ENTERPRISE-RELEASE-BOUNDARY.md. Kept running so the image does not
  # rot, but not required: a red check here must not block a stdio release.
  # Make it required again when that transport is re-exposed.
  container-release:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --engine-strict
      - name: Install checksummed Trivy 0.70.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file trivy.tar.gz trivy
          sudo install --mode 0755 trivy /usr/local/bin/trivy
          trivy --version
      - run: npm run container:build
      - run: npm run container:validate
      - run: MCP_CONTAINER_SCANNER=trivy npm run container:scan
