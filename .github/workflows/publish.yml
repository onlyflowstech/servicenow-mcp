name: Publish

# Strict stable-release tags only (matches the old GitLab
# `^v\d+\.\d+\.\d+$` rule): pre-release tags like v1.1.0-beta.1 must NOT
# publish to the npm "latest" dist-tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  portable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --engine-strict
      - run: npm run release:contract
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:protocol
      - run: npm run test:profile
      - run: npm run test:release
      - run: npm pack --dry-run --json --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate

  inspector-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci --prefix tools/inspector --engine-strict --ignore-scripts
      - run: npm audit --prefix tools/inspector --audit-level=moderate

  container-release:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --engine-strict
      - name: Install checksummed Trivy 0.70.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file trivy.tar.gz trivy
          sudo install --mode 0755 trivy /usr/local/bin/trivy
          trivy --version
      - run: npm run container:build
      - run: npm run container:validate
      - run: MCP_CONTAINER_SCANNER=trivy npm run container:scan

  publish:
    # container-release is deliberately absent. It builds and validates an OCI
    # image for the dormant HTTP transport, which 2.0 does not ship, so a
    # failure there must not block publishing the package that users actually
    # install. It still runs and reports. Add it back when that transport is
    # re-exposed — see docs/ENTERPRISE-RELEASE-BOUNDARY.md.
    needs:
      - portable-release
      - inspector-toolchain
    runs-on: ubuntu-latest
    # Published through npm trusted publishing (OIDC): npm verifies this
    # workflow's identity and issues a short-lived credential, so there is no
    # long-lived NPM_TOKEN to store, leak, or rotate, and no 2FA-bypass token
    # to obtain. id-token: write is what lets the runner mint the OIDC token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10.x, which predates trusted publishing. Pin the 11
      # line rather than @latest: npm 12 raised its engine floor to Node
      # ^22.22.2, so @latest silently stops matching the Node pinned above.
      # 11.5.1 is the documented minimum for trusted publishing.
      - run: npm install --global npm@^11.5.1
      - run: npm --version
      - run: npm ci --engine-strict
      # No NODE_AUTH_TOKEN: the OIDC exchange supplies the credential.
      # Provenance is attested automatically for a public repository, so
      # --provenance is not passed explicitly.
      - run: npm publish --access public
